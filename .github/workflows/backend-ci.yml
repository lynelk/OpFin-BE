name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan key:generate

      - name: Enforce CPay-only production money movement
        shell: bash
        run: |
          set -euo pipefail
          forbidden_files=(
            app/Services/MtnMomoService.php
            app/Services/AirtelCollectionService.php
            app/Services/AirtelDisbursementService.php
            app/Services/CitotechPaymentService.php
            app/Services/MobileMoney/Adapters/MtnMobileMoneyAdapter.php
            app/Services/MobileMoney/Adapters/AirtelMoneyAdapter.php
          )
          for file in "${forbidden_files[@]}"; do
            if [ -e "$file" ]; then
              echo "Forbidden direct payment implementation exists: $file"
              exit 1
            fi
          done
          if grep -R -nE 'MtnMomoService|AirtelDisbursementService|AirtelCollectionService|CitotechPaymentService|MtnMobileMoneyAdapter|AirtelMoneyAdapter' app config routes tests; then
            echo "Direct provider payment reference detected. OpFin must route production money movement through CPay."
            exit 1
          fi

      - name: Run tests
        run: php artisan test

      - name: Check PHP formatting for changed files
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed PHP files to lint."
            exit 0
          fi
          printf 'Checking %s changed PHP files\n' "${#files[@]}"
          ./vendor/bin/pint --test "${files[@]}"

      - name: Audit Composer dependencies
        run: composer audit

  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
