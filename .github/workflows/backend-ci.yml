name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan key:generate

      - name: Enforce CPay-only production money movement
        run: sh scripts/enforce-cpay-only.sh

      - name: Run hermetic tests
        run: sh scripts/run-tests.sh

      - name: Normalize changed PHP files with Pint
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed PHP files to format."
            exit 0
          fi
          ./vendor/bin/pint "${files[@]}"

      - name: Commit Pint normalization
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Pint made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          git commit -m "Apply Pint formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Verify PHP formatting
        shell: bash
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          ./vendor/bin/pint --test "${files[@]}"

      - name: Audit Composer dependencies
        run: composer audit

  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
