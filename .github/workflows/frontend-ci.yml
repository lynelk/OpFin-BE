name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_OPFIN_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_USE_MOCK_API: "false"
          OPFIN_ENABLE_DEMO_SHORTCUTS: "false"
        run: npm run build

      - name: Reject production mock API mode
        env:
          NODE_ENV: production
          NEXT_PUBLIC_USE_MOCK_API: "true"
        run: |
          if node -e "import('./next.config.mjs')"; then
            echo "Expected production mock API guard to fail"
            exit 1
          fi

      - name: Reject production demo shortcuts
        env:
          NODE_ENV: production
          OPFIN_ENABLE_DEMO_SHORTCUTS: "true"
        run: |
          if node -e "import('./next.config.mjs')"; then
            echo "Expected production demo shortcut guard to fail"
            exit 1
          fi

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opfin-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android release
        run: |
          status=1
          for attempt in 1 2 3; do
            if flutter build apk --release --no-pub; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Android release build attempt $attempt failed; retrying in ${delay}s for transient repository/network errors."
              sleep "$delay"
            fi
          done
          exit "$status"
