name: Temporary Pint Long Range

on:
  push:
    branches:
      - release/long-range-concept-completion-20260831

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/long-range-concept-completion-20260831
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint app/Http/Controllers/Api/LongRangeGovernanceController.php app/Http/Controllers/Api/LongRangePlatformController.php app/Services/LongRangeFinancialActionService.php app/Services/LongRangeGovernanceService.php app/Services/LongRangeIntegrityService.php app/Services/LongRangePlatformService.php bootstrap/app.php tests/Feature/LongRangeConceptCompletionTest.php
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/Api/LongRangeGovernanceController.php app/Http/Controllers/Api/LongRangePlatformController.php app/Services/LongRangeFinancialActionService.php app/Services/LongRangeGovernanceService.php app/Services/LongRangeIntegrityService.php app/Services/LongRangePlatformService.php bootstrap/app.php tests/Feature/LongRangeConceptCompletionTest.php
          git commit -m "Apply Pint formatting to long-range implementation"
          git push origin HEAD:release/long-range-concept-completion-20260831
