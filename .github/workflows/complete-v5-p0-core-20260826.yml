          tx=Path('app/Http/Controllers/Api/TransactionController.php')
          text=tx.read_text()
          for name in ['handleCallback','airtelCallback','mtnCallback']:
              m=re.search(r'    public function '+name+r'\(Request \$request\)\n    \{',text)
              if not m: raise SystemExit('missing '+name)
              start=m.start(); brace=m.end()-1; depth=0; end=None
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              tomb=f'''    public function {name}(Request $request)\n    {{\n        return response()->json([\n            'status' => 'gone',\n            'message' => 'Provider callbacks must terminate at CPay and arrive through /webhooks/cpay.',\n        ], 410);\n    }}'''
