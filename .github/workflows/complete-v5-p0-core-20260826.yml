use App\Services\V5P0PlatformService;
use App\Support\ApiResponse;
use Illuminate\Http\JsonResponse;
use Illuminate\Http\Request;
use InvalidArgumentException;

class V5P0PlatformController extends Controller
{
    public function __construct(private V5P0PlatformService $service) {}
    private function actor(Request $r): string { return 'USER:'.($r->user()?->id ?? 'system'); }
    private function run(callable $fn): JsonResponse { try{return ApiResponse::success('OK.',$fn());}catch(InvalidArgumentException $e){return ApiResponse::error($e->getMessage(),422);} }
    public function security(Request $r): JsonResponse{return $this->run(fn()=>$this->service->security($r->user()));}
    public function updateSecurity(Request $r): JsonResponse{return $this->run(fn()=>$this->service->updateSecurity($r->user(),$r->all(),$this->actor($r),$r->ip()));}
    public function creditBuilder(Request $r): JsonResponse{return $this->run(fn()=>$this->service->creditBuilder($r->user()));}
    public function saveCreditBuilder(Request $r): JsonResponse{return $this->run(fn()=>$this->service->saveCreditBuilder($r->user(),$r->all()));}
    public function hardship(Request $r): JsonResponse{return $this->run(fn()=>$this->service->hardship($r->user()));}
    public function openHardship(Request $r): JsonResponse{return $this->run(fn()=>$this->service->openHardship($r->user(),$r->all(),$this->actor($r)));}
    public function passport(Request $r): JsonResponse{return $this->run(fn()=>$this->service->passport($r->user()));}
    public function reconciliation(Request $r): JsonResponse{return $this->run(fn()=>$this->service->reconciliation($r->user()));}
    public function approveHardship(Request $r,int $case): JsonResponse{return $this->run(fn()=>$this->service->approveHardship($case,$r->input('approved_relief',[]),$this->actor($r)));}
    public function createProduct(Request $r): JsonResponse{return $this->run(fn()=>$this->service->createProduct($r->all(),$this->actor($r)));}
    public function transitionProduct(Request $r,int $product): JsonResponse{return $this->run(fn()=>$this->service->productTransition($product,$r->string('status')->toString(),$this->actor($r)));}
    public function createRule(Request $r): JsonResponse{return $this->run(fn()=>$this->service->createRule($r->all(),$this->actor($r)));}
    public function approveRule(Request $r,int $rule): JsonResponse{return $this->run(fn()=>$this->service->approveRule($rule,$this->actor($r)));}
    public function evaluateRules(Request $r): JsonResponse{return $this->run(fn()=>$this->service->evaluateRules($r->input('context',[])));}
    public function createWorkflow(Request $r): JsonResponse{return $this->run(fn()=>$this->service->createWorkflow($r->all(),$this->actor($r)));}
    public function approveWorkflow(Request $r,int $workflow): JsonResponse{return $this->run(fn()=>$this->service->approveWorkflow($workflow,$this->actor($r)));}
    public function startWorkflow(Request $r,int $workflow): JsonResponse{return $this->run(fn()=>$this->service->startWorkflow($workflow,$r->user(),$r->string('subject_type')->toString(),$r->string('subject_reference')->toString(),$r->input('context',[])));}
    public function transitionWorkflow(Request $r,int $run): JsonResponse{return $this->run(fn()=>$this->service->transitionWorkflow($run,$r->string('to_state')->toString(),$this->actor($r),$r->input('context',[])));}
}
