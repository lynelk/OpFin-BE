name: Finalize Financial Compass

on:
  push:
    branches:
      - completion/v5-financial-compass-20260826
    paths:
      - .github/workflows/finalize-financial-compass-20260826.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: completion/v5-financial-compass-20260826
          fetch-depth: 0
      - name: Wire production API routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('routes/api.php')
          text = path.read_text()
          import_line = 'use App\\Http\\Controllers\\Api\\FinancialWellbeingController;\n'
          if import_line not in text:
              marker = 'use App\\Http\\Controllers\\Api\\FoundationAdminController;\n'
              if marker not in text:
                  raise SystemExit('Controller import marker missing')
              text = text.replace(marker, import_line + marker, 1)
          routes = '''    Route::get('/financial-compass', [FinancialWellbeingController::class, 'compass']);
    Route::get('/financial-categories', [FinancialWellbeingController::class, 'categories']);
    Route::get('/financial-accounts', [FinancialWellbeingController::class, 'accounts']);
    Route::post('/financial-accounts', [FinancialWellbeingController::class, 'storeAccount']);
    Route::patch('/financial-accounts/{account}', [FinancialWellbeingController::class, 'updateAccount']);
    Route::delete('/financial-accounts/{account}', [FinancialWellbeingController::class, 'destroyAccount']);
    Route::get('/budgets', [FinancialWellbeingController::class, 'budgets']);
    Route::post('/budgets', [FinancialWellbeingController::class, 'storeBudget']);
    Route::patch('/budgets/{budget}', [FinancialWellbeingController::class, 'updateBudget']);
    Route::delete('/budgets/{budget}', [FinancialWellbeingController::class, 'destroyBudget']);
    Route::get('/cash-flow', [FinancialWellbeingController::class, 'cashFlow']);
    Route::post('/cash-flow/entries', [FinancialWellbeingController::class, 'storeEntry']);
    Route::patch('/cash-flow/entries/{entry}', [FinancialWellbeingController::class, 'updateEntry']);
    Route::get('/financial-calendar', [FinancialWellbeingController::class, 'calendar']);
    Route::post('/financial-calendar/events', [FinancialWellbeingController::class, 'storeCalendarEvent']);
    Route::patch('/financial-calendar/events/{event}', [FinancialWellbeingController::class, 'updateCalendarEvent']);
    Route::delete('/financial-calendar/events/{event}', [FinancialWellbeingController::class, 'destroyCalendarEvent']);
'''
          if "Route::get('/financial-compass'" not in text:
              marker = "    Route::get('/capabilities', [CapabilityController::class, 'index']);\n"
              if marker not in text:
                  raise SystemExit('Route insertion marker missing')
              text = text.replace(marker, marker + routes, 1)
          path.write_text(text)
          PY
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Prepare application
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
      - name: Format tranche
        run: ./vendor/bin/pint app/Services/FinancialWellbeingService.php app/Http/Controllers/Api/FinancialWellbeingController.php database/migrations/2026_08_26_010000_create_financial_wellbeing_tables.php tests/Feature/FinancialWellbeingTest.php routes/api.php
      - name: Run focused tests
        run: php artisan test tests/Feature/FinancialWellbeingTest.php
      - name: Run full backend tests
        run: php artisan test
      - name: Audit dependencies
        run: composer audit --no-interaction
      - name: Commit verified tranche
        run: |
          git config user.name "opfin-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/Services/FinancialWellbeingService.php app/Http/Controllers/Api/FinancialWellbeingController.php database/migrations/2026_08_26_010000_create_financial_wellbeing_tables.php tests/Feature/FinancialWellbeingTest.php routes/api.php
          if git diff --cached --quiet; then
            echo 'No formatting or route changes to commit'
            exit 0
          fi
          git commit -m "feat(financial-compass): complete budget cashflow and calendar APIs"
          git push origin HEAD:completion/v5-financial-compass-20260826
