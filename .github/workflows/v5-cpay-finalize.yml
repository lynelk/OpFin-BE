name: OpFin v5 CPay Finalize

on:
  push:
    branches:
      - completion/v5-cpay-integration-20260826
    paths:
      - .github/workflows/v5-cpay-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: completion/v5-cpay-integration-20260826
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply v5 CPay contract fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/Unit/ProductionConfigurationTest.php')
          test = test_path.read_text()
          test = test.replace(
              "MOBILE_MONEY_PROVIDER=mock is not allowed in production.",
              "Production money movement must use CPay. Set MOBILE_MONEY_PROVIDER=cpay; direct MTN/Airtel/mock routing is not allowed in OpFin."
          )
          test = test.replace(
              "'mobile_money_provider' => 'mtn',\n            'enable_demo_routes' => true,",
              "'mobile_money_provider' => 'cpay',\n            'enable_demo_routes' => true,"
          )
          test_path.write_text(test)

          adapter_path = Path('app/Services/MobileMoney/Adapters/CpayV2Adapter.php')
          adapter = adapter_path.read_text()
          old = '''        $eventType = strtolower(trim((string) ($payload['eventType'] ?? '')));
        $status = strtoupper(trim((string) ($payload['status'] ?? '')));

        if ($status === '') {
            $status = match ($eventType) {
                'payment.completed', 'payout.completed', 'refund.completed' => 'SUCCESSFUL',
                'payment.failed', 'payout.failed', 'refund.failed' => 'FAILED',
                default => 'PENDING',
            };
        }

        $normalizedStatus = $this->normalizeStatus($status);

        return new MobileMoneyProviderResponse(
            provider: 'cpay',
            successful: $normalizedStatus !== MobileMoneyTransaction::STATUS_FAILED,
            status: $normalizedStatus,
            providerReference: $payload['transactionId'] ?? $payload['reference'] ?? null,
            message: 'CPay webhook event normalized.',
            retryable: $normalizedStatus === MobileMoneyTransaction::STATUS_PENDING,
            reconciliationStatus: $normalizedStatus === MobileMoneyTransaction::STATUS_FAILED
                ? MobileMoneyTransaction::RECONCILIATION_EXCEPTION
                : MobileMoneyTransaction::RECONCILIATION_PENDING,
            webhookEventId: $payload['eventId'] ?? null,
            raw: $payload,
        );'''
          new = '''        $data = is_array($payload['data'] ?? null) ? $payload['data'] : [];
        $eventType = strtolower(trim((string) ($payload['eventType'] ?? $payload['event_type'] ?? '')));
        $status = strtoupper(trim((string) ($payload['status'] ?? $data['status'] ?? '')));

        if ($status === '') {
            $status = match ($eventType) {
                'payment.completed', 'payment.succeeded', 'payment.successful',
                'payout.completed', 'payout.succeeded', 'payout.successful',
                'refund.completed', 'refund.succeeded', 'refund.successful' => 'SUCCESSFUL',
                'payment.failed', 'payout.failed', 'refund.failed' => 'FAILED',
                default => 'PENDING',
            };
        }

        $normalizedStatus = $this->normalizeStatus($status);
        $providerReference = $payload['transactionId']
            ?? $payload['transaction_id']
            ?? $data['transactionId']
            ?? $data['transaction_id']
            ?? $payload['reference']
            ?? $data['reference']
            ?? null;

        return new MobileMoneyProviderResponse(
            provider: 'cpay',
            successful: $normalizedStatus !== MobileMoneyTransaction::STATUS_FAILED,
            status: $normalizedStatus,
            providerReference: $providerReference,
            message: 'CPay webhook event normalized.',
            retryable: $normalizedStatus === MobileMoneyTransaction::STATUS_PENDING,
            reconciliationStatus: $normalizedStatus === MobileMoneyTransaction::STATUS_FAILED
                ? MobileMoneyTransaction::RECONCILIATION_EXCEPTION
                : MobileMoneyTransaction::RECONCILIATION_PENDING,
            webhookEventId: $payload['eventId'] ?? $payload['event_id'] ?? null,
            raw: $payload,
        );'''
          if old not in adapter:
              raise SystemExit('CPay webhook normalization block not found')
          adapter_path.write_text(adapter.replace(old, new))

          service_path = Path('app/Services/MobileMoney/MobileMoneyService.php')
          service = service_path.read_text()
          old_find = '''        if ($providerName === 'cpay') {
            $merchantReference = $payload['reference'] ?? null;
            $transactionId = $payload['transactionId'] ?? $providerReference;'''
          new_find = '''        if ($providerName === 'cpay') {
            $data = is_array($payload['data'] ?? null) ? $payload['data'] : [];
            $merchantReference = $payload['reference']
                ?? $payload['merchantReference']
                ?? $payload['merchant_reference']
                ?? $data['merchantReference']
                ?? $data['merchant_reference']
                ?? null;
            $transactionId = $payload['transactionId']
                ?? $payload['transaction_id']
                ?? $data['transactionId']
                ?? $data['transaction_id']
                ?? $providerReference;'''
          if old_find not in service:
              raise SystemExit('CPay webhook correlation block not found')
          service_path.write_text(service.replace(old_find, new_find))
          PY
      - name: Prepare application
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
      - name: Format changed PHP
        run: ./vendor/bin/pint app/Services/MobileMoney/Adapters/CpayV2Adapter.php app/Services/MobileMoney/MobileMoneyService.php tests/Unit/ProductionConfigurationTest.php
      - name: Run backend tests
        run: php artisan test
      - name: Audit Composer dependencies
        run: composer audit --no-interaction
      - name: Build assets
        run: |
          npm ci
          npm run build
      - name: Commit verified fixes
        run: |
          git config user.name "opfin-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/Services/MobileMoney/Adapters/CpayV2Adapter.php app/Services/MobileMoney/MobileMoneyService.php tests/Unit/ProductionConfigurationTest.php
          if git diff --cached --quiet; then
            echo "No fixes required"
            exit 0
          fi
          git commit -m "fix(cpay): normalize signed v2 event envelopes"
          git push origin HEAD:completion/v5-cpay-integration-20260826
